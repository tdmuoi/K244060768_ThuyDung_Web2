<p>product-list-call-http-service-component works!</p>
<table border="1">
    <thead>
        <tr>
            <td>ID</td>
            <td>Name</td>
            <td>Price</td>
            <td>Image</td>
        </tr>
    </thead>
    <tbody>
        @for (product of products(); track product.id) {
        <tr [class.price-negative]="product.price < 0">
            <td>{{ product.id }}</td>
            <td>
                <a [routerLink]="['/products', product.id]">
                    {{ product.name }}
                </a>
            </td>
            <td>
                <a [routerLink]="['/products', product.id]">
                    {{ product.price }}
                </a>
            </td>
            <td>
                <a [routerLink]="['/products', product.id]">
                    <img [src]="product.image" [alt]="product.name" width="100" height="100">
                </a>
            </td>
        </tr>
        }
        @empty {
        <tr>
            <td colspan="4">No products available.</td>
        </tr>
        }
    </tbody>
</table>
