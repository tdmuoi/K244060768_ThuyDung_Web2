<p>product-list-call-service-component works!</p>
Min Price: <input type="number" [(ngModel)]="minPrice">
Max Price: <input type="number" [(ngModel)]="maxPrice">
<button (click)="doFilter()">Filter</button>
<table border="1">
    <thead>
        <tr>
            <td>ID</td>
            <td>Name</td>
            <td>Price</td>
            <td>Image</td>
        </tr>
    </thead>
    <tbody>
        @for (product of products; track product.id) {
            <tr [class.price-negative]="product.price < 0">
                <td>{{ product.id }}</td>
                <td>{{ product.name }}</td>
                <td>{{ product.price }}</td>
                <td><img [src]="product.image" [alt]="product.name" width="100" height="100"></td>
            </tr>
        }
        @empty {
            <tr>
                <td colspan="4">No products available.</td>
            </tr>
        }
    </tbody>
</table>
