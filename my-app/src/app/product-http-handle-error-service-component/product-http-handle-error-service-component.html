<p>product-http-handle-error-service-component works!</p>
<p>Error: {{ errMessage() }}</p>
<table border="1">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Price</th>
    </tr>
  </thead>
  <tbody>
    @if (products().length > 0) {
      @for (p of products(); track p.id) {
        <tr>
          <td>{{ p.id }}</td>
          <td>{{ p.name }}</td>
          <td>{{ p.price }}</td>
        </tr>
      }
    } @else {
      <tr>
        <td colspan="3">No products available.</td>
      </tr>
    }
  </tbody>
</table>
